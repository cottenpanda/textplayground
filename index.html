<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&family=Playfair+Display:ital,opsz,wght@0,5..1200,400;0,5..1200,700;0,5..1200,900;1,5..1200,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <title>Text Playground</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-6px) rotate(1deg); }
      75% { transform: translateY(4px) rotate(-1deg); }
    }
    .placed-image {
      animation: float 3s ease-in-out infinite;
    }
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: calc(44px + env(safe-area-inset-top, 0px));
      padding-top: env(safe-area-inset-top, 0px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 20;
    }
    #mode-toggle {
      display: flex;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      overflow: hidden;
    }
    #mode-toggle button {
      font: 600 12px Helvetica, Arial, sans-serif;
      padding: 6px 18px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    #mode-toggle button.mode-active {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    #mode-toggle button:active { opacity: 0.7; }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      touch-action: none;
    }
    #bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.08);
      z-index: 20;
    }
    #bottom-bar button {
      font: 600 12px Helvetica, Arial, sans-serif;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
    }
    #bottom-bar button.active {
      background: rgba(255,255,255,0.15);
      color: #fff;
      border-color: rgba(255,255,255,0.35);
    }
    #bottom-bar button:active { transform: scale(0.95); }
    #reset-btn {
      background: #ffffff !important;
      color: #000 !important;
      border: none !important;
    }
    #reset-btn:active { background: #ddd !important; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <!-- TOP BAR (hidden — restore to re-enable mobile view)
  <div id="top-bar">
    <div id="mode-toggle">
      <button id="mode-mobile">Mobile</button>
      <button id="mode-desktop" class="mode-active">Desktop</button>
    </div>
  </div>
  -->
  <div id="bottom-bar">
    <button id="shake-btn">Shake</button>
    <button id="reset-btn">Reset</button>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
